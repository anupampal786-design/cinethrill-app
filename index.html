<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Find the best thrillers to watch tonight." />
    
    <!-- POCKET POWER: Links to the Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2503/2503508.png" />
    
    <title>CineThrill</title>
    
    <!-- React & Tailwind Setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-neutral-900 text-white">
    <div id="root"></div>

    <!-- POCKET POWER: Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('Worker Registered'))
            .catch(err => console.log('Worker Failed', err));
        });
      }
    </script>

    <!-- THE FULL APP CODE -->
    <script type="text/babel" data-presets="react">
      const { useState, useEffect } = React;

      // --- ICONS (Inlined for Browser Compatibility) ---
      const IconBase = ({ children, className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
      );
      const Play = ({ className }) => <IconBase className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></IconBase>;
      const RefreshCw = ({ className }) => <IconBase className={className}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21h5v-5"></path></IconBase>;
      const Star = ({ className }) => <IconBase className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></IconBase>;
      const Info = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></IconBase>;
      const Film = ({ className }) => <IconBase className={className}><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></IconBase>;
      const Filter = ({ className }) => <IconBase className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></IconBase>;
      const ExternalLink = ({ className }) => <IconBase className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></IconBase>;
      const Copy = ({ className }) => <IconBase className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></IconBase>;
      const Check = ({ className }) => <IconBase className={className}><polyline points="20 6 9 17 4 12"></polyline></IconBase>;
      const AlertCircle = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></IconBase>;
      const Heart = ({ className }) => <IconBase className={className}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></IconBase>;
      const Trash2 = ({ className }) => <IconBase className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
      const ArrowLeft = ({ className }) => <IconBase className={className}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></IconBase>;
      const Search = ({ className }) => <IconBase className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></IconBase>;
      const Youtube = ({ className }) => <IconBase className={className}><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></IconBase>;
      const XIcon = ({ className }) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconBase>;
      const Download = ({ className }) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></IconBase>;

      // --- CONFIGURATION ---
      const API_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjYmYwOTE0NjJmMmQyNGE5NWNmNmNjN2JkZTFiZTAwZSIsIm5iZiI6MTc2NDk2OTQxMS4xNTUsInN1YiI6IjY5MzM0YmMzMzdmYzMyNmM2ZjQ4ZTM0NyIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.wSDP6eANdsXiz1fGJ5Iy9uVCLGg0-We23FxyVTi5drY";
      const BASE_URL = "https://api.themoviedb.org/3";
      const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w1280";

      // TMDB Data
      const GENRES = { 'Thriller': 53, 'Crime': 80, 'Mystery': 9648, 'Drama': 18, 'Horror': 27, 'Action': 28 };
      const LANGUAGES = { 'Bengali': 'bn', 'Hindi': 'hi', 'English': 'en', 'Korean': 'ko', 'Spanish': 'es', 'All': 'all' };

      const MovieApp = () => {
        const [currentMovie, setCurrentMovie] = useState(null);
        const [isAnimating, setIsAnimating] = useState(false);
        const [copyStatus, setCopyStatus] = useState('idle');
        const [imageError, setImageError] = useState(false);
        const [searchQuery, setSearchQuery] = useState('');
        const [showTrailer, setShowTrailer] = useState(false);
        const [trailerKey, setTrailerKey] = useState(null);
        const [installPrompt, setInstallPrompt] = useState(null);
        const [isInstalled, setIsInstalled] = useState(false);
        const [viewingWatchlist, setViewingWatchlist] = useState(false);
        const [selectedLanguage, setSelectedLanguage] = useState('Bengali');
        const [selectedGenre, setSelectedGenre] = useState('Thriller');
        const [showFilters, setShowFilters] = useState(false);
        
        const [watchlist, setWatchlist] = useState(() => {
          try {
            const saved = localStorage.getItem('myWatchlist');
            return saved ? JSON.parse(saved) : [];
          } catch (e) { return []; }
        });

        // Auto-refresh when filters change
        useEffect(() => {
          handleGenerate();
        }, [selectedLanguage, selectedGenre]);

        useEffect(() => {
          window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); setInstallPrompt(e); });
          if (window.matchMedia('(display-mode: standalone)').matches) setIsInstalled(true);
        }, []);

        useEffect(() => {
          localStorage.setItem('myWatchlist', JSON.stringify(watchlist));
        }, [watchlist]);

        const toggleWatchlist = (movie) => {
          const exists = watchlist.find(m => m.id === movie.id);
          if (exists) setWatchlist(watchlist.filter(m => m.id !== movie.id));
          else setWatchlist([...watchlist, movie]);
        };

        const isInWatchlist = (movieId) => {
          return watchlist.some(m => m.id === movieId);
        };

        const handleInstallClick = async () => {
          if (installPrompt) {
            installPrompt.prompt();
            const { outcome } = await installPrompt.userChoice;
            if (outcome === 'accepted') setInstallPrompt(null);
          } else {
            alert("📱 How to Install:\n\n1. Tap 'Share' (Safari) or the menu dots (Chrome).\n2. Select 'Add to Home Screen'.\n\nThis creates a real app icon on your phone!");
          }
        };

        const fetchTrailer = async (movieId) => {
          try {
            const response = await fetch(`${BASE_URL}/movie/${movieId}/videos`, { headers: { Authorization: `Bearer ${API_TOKEN}` } });
            const data = await response.json();
            const trailer = data.results?.find(vid => vid.type === "Trailer" && vid.site === "YouTube");
            return trailer ? trailer.key : null;
          } catch (e) { return null; }
        };

        const openTrailer = async () => {
          if (!currentMovie?.id) return;
          const key = await fetchTrailer(currentMovie.id);
          if (key) { setTrailerKey(key); setShowTrailer(true); } 
          else { alert("Sorry, no trailer available for this movie!"); }
        };

        const fetchMoviesFromTMDB = async (query = '') => {
          try {
            let url;
            let pageToFetch = 1;

            if (query.trim().length > 0) {
              // Search mode: Always Page 1
              url = `${BASE_URL}/search/movie?query=${encodeURIComponent(query)}&include_adult=false&page=1`;
            } else {
              // Discover mode: Use POPULARITY to show trending/new content
              // We also randomize pages 1-5 to keep it fresh
              pageToFetch = Math.floor(Math.random() * 5) + 1;
              
              // NEW SORTING: Popularity Descending (Trending) + Rating > 6.0 (Good Quality)
              url = `${BASE_URL}/discover/movie?sort_by=popularity.desc&vote_average.gte=6.0&vote_count.gte=10&include_adult=false&page=${pageToFetch}`;
              
              if (selectedGenre !== 'All' && GENRES[selectedGenre]) url += `&with_genres=${GENRES[selectedGenre]}`;
              else url += `&with_genres=53,80`;
              
              if (selectedLanguage !== 'All' && LANGUAGES[selectedLanguage]) url += `&with_original_language=${LANGUAGES[selectedLanguage]}`;
              url += `&watch_region=IN`;
            }

            const options = { method: 'GET', headers: { accept: 'application/json', Authorization: `Bearer ${API_TOKEN}` } };
            
            // First Attempt
            let response = await fetch(url, options);
            let data = await response.json();

            // FALLBACK: If random page empty, try Page 1
            if ((!data.results || data.results.length === 0) && pageToFetch > 1) {
               url = url.replace(`page=${pageToFetch}`, 'page=1');
               response = await fetch(url, options);
               data = await response.json();
            }

            if (!data.results || data.results.length === 0) return null;

            const rawMovie = query.trim().length > 0 ? data.results[0] : data.results[Math.floor(Math.random() * data.results.length)];
            const providerRes = await fetch(`${BASE_URL}/movie/${rawMovie.id}/watch/providers`, options);
            const providerData = await providerRes.json();
            const providers = providerData.results?.IN || providerData.results?.US;
            let platformName = 'Check Online';
            let platformLink = `https://www.google.com/search?q=watch+${encodeURIComponent(rawMovie.title)}+movie`;
            
            if (providers?.flatrate && providers.flatrate.length > 0) {
              platformName = providers.flatrate[0].provider_name;
              if (platformName.toLowerCase().includes('netflix')) platformLink = `https://www.netflix.com/search?q=${encodeURIComponent(rawMovie.title)}`;
              else if (platformName.toLowerCase().includes('hotstar')) platformLink = `https://www.hotstar.com/in/explore?q=${encodeURIComponent(rawMovie.title)}`;
              else if (platformName.toLowerCase().includes('prime')) platformLink = `https://www.amazon.com/s?k=${encodeURIComponent(rawMovie.title)}`;
              else if (platformName.toLowerCase().includes('hoichoi')) platformLink = `https://www.hoichoi.tv/search?q=${encodeURIComponent(rawMovie.title)}`;
              else if (platformName.toLowerCase().includes('zee5')) platformLink = `https://www.zee5.com/search?q=${encodeURIComponent(rawMovie.title)}`;
            }

            return {
              id: rawMovie.id,
              title: rawMovie.title,
              year: rawMovie.release_date ? rawMovie.release_date.split('-')[0] : 'N/A',
              language: rawMovie.original_language.toUpperCase(),
              genre: [selectedGenre === 'All' ? 'Movie' : selectedGenre],
              rating: rawMovie.vote_average.toFixed(1),
              plot: rawMovie.overview,
              poster: rawMovie.poster_path ? `${IMAGE_BASE_URL}${rawMovie.poster_path}` : null,
              backdrop: rawMovie.backdrop_path ? `${IMAGE_BASE_URL}${rawMovie.backdrop_path}` : null,
              platform: platformName,
              platformUrl: platformLink,
            };
          } catch (error) { return null; }
        };

        const handleGenerate = async (overrideQuery = null) => {
          setIsAnimating(true);
          setCopyStatus('idle');
          setViewingWatchlist(false);
          setImageError(false);
          setShowTrailer(false);
          const queryToUse = overrideQuery !== null ? overrideQuery : searchQuery;
          const movie = await fetchMoviesFromTMDB(queryToUse);
          setTimeout(() => {
            if (movie) setCurrentMovie(movie);
            else alert("No movies found! Try a different search.");
            setIsAnimating(false);
          }, 800);
        };

        const handleSearchSubmit = (e) => { e.preventDefault(); handleGenerate(searchQuery); };
        const getPlatformColor = (platform) => {
          if (!platform) return 'bg-gray-700 hover:bg-gray-600 text-white';
          const p = platform.toLowerCase();
          if (p.includes('netflix')) return 'bg-red-600 hover:bg-red-700 text-white';
          if (p.includes('prime') || p.includes('amazon')) return 'bg-blue-500 hover:bg-blue-600 text-white';
          if (p.includes('hotstar')) return 'bg-[#133063] hover:bg-[#1a4082] text-white';
          if (p.includes('hoichoi')) return 'bg-orange-500 hover:bg-orange-600 text-white';
          if (p.includes('zee5')) return 'bg-purple-600 hover:bg-purple-700 text-white';
          return 'bg-gray-700 hover:bg-gray-600 text-white';
        };

        const handleWatchClick = (url) => {
          if (!url) return;
          const newWindow = window.open(url, '_blank');
          if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
            handleCopyLink();
            alert("Popup blocked: Link copied to clipboard.");
          }
        };

        const handleCopyLink = () => {
          if (!currentMovie?.platformUrl) return;
          const textArea = document.createElement("textarea");
          textArea.value = currentMovie.platformUrl;
          document.body.appendChild(textArea);
          textArea.select();
          try { document.execCommand('copy'); setCopyStatus('success'); setTimeout(() => setCopyStatus('idle'), 3000); } catch (err) { setCopyStatus('error'); }
          document.body.removeChild(textArea);
        };

        return (
          <div className="min-h-screen pb-20 font-sans">
            {showTrailer && trailerKey && (
              <div className="fixed inset-0 z-[60] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="relative w-full max-w-4xl aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-neutral-800">
                  <button onClick={() => setShowTrailer(false)} className="absolute top-4 right-4 z-10 p-2 bg-black/50 hover:bg-red-600 rounded-full text-white transition-colors"><XIcon className="w-6 h-6" /></button>
                  <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${trailerKey}?autoplay=1`} title="Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe>
                </div>
              </div>
            )}

            <nav className="border-b border-neutral-800 bg-neutral-900/95 sticky top-0 z-50 backdrop-blur-sm">
              <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
                <div className="flex items-center gap-2 cursor-pointer shrink-0" onClick={() => {setViewingWatchlist(false); setSearchQuery(''); handleGenerate('');}}>
                  <Film className="w-6 h-6 text-red-500" />
                  <span className="text-xl font-bold tracking-tight text-white hidden sm:block">Cine<span className="text-red-500">Thrill</span></span>
                </div>
                <form onSubmit={handleSearchSubmit} className="flex-1 max-w-md relative group">
                  <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 group-focus-within:text-red-500 transition-colors" />
                  <input type="text" placeholder="Search movies..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-neutral-800 border border-neutral-700 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all text-white placeholder:text-gray-500" />
                </form>
                <div className="flex items-center gap-2">
                  {!isInstalled && (
                    <button onClick={handleInstallClick} className="shrink-0 relative flex items-center gap-2 text-xs font-bold bg-neutral-800 hover:bg-neutral-700 text-gray-300 hover:text-white px-3 py-2 rounded-lg transition-colors border border-transparent hover:border-neutral-600" title="Install App">
                      <Download className="w-4 h-4" /><span>Install</span>
                    </button>
                  )}
                  <button onClick={() => setViewingWatchlist(true)} className="shrink-0 relative flex items-center gap-2 text-xs font-bold bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-2 rounded-lg transition-colors">
                    <Heart className={`w-4 h-4 ${watchlist.length > 0 ? 'fill-red-500 text-red-500' : 'text-gray-400'}`} />
                    {watchlist.length > 0 && <span className="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[9px]">{watchlist.length}</span>}
                  </button>
                </div>
              </div>
            </nav>

            <main className="max-w-4xl mx-auto px-4 py-8">
              {viewingWatchlist ? (
                <div className="animate-in fade-in slide-in-from-bottom-4">
                  <div className="flex items-center gap-3 mb-6">
                    <button onClick={() => setViewingWatchlist(false)} className="p-2 rounded-full hover:bg-neutral-800 transition-colors"><ArrowLeft className="w-6 h-6" /></button>
                    <h1 className="text-3xl font-bold text-white">My Treasure Chest</h1>
                  </div>
                  {watchlist.length === 0 ? (
                    <div className="flex flex-col items-center justify-center h-64 text-center border-2 border-dashed border-neutral-800 rounded-2xl">
                      <Heart className="w-12 h-12 text-neutral-800 mb-4" />
                      <p className="text-gray-500 font-medium">Your chest is empty!</p>
                      <button onClick={() => setViewingWatchlist(false)} className="mt-6 px-6 py-2 bg-red-600 rounded-full text-white text-sm font-bold shadow-lg">Find Movies</button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {watchlist.map(movie => (
                        <div key={movie.id} className="flex gap-4 p-4 bg-neutral-800 rounded-xl border border-neutral-700">
                          <img src={movie.poster} alt={movie.title} className="w-16 h-24 object-cover rounded-lg bg-neutral-900" onError={(e) => e.target.style.display = 'none'} />
                          <div className="flex-1">
                            <h3 className="font-bold text-lg leading-tight line-clamp-1">{movie.title}</h3>
                            <div className="flex items-center gap-2 text-xs text-gray-400 mt-1 mb-3"><span>{movie.year}</span><span className="text-yellow-500 flex items-center gap-1"><Star className="w-3 h-3 fill-current" /> {movie.rating}</span></div>
                            <div className="flex gap-2">
                              <button onClick={() => handleWatchClick(movie.platformUrl)} className="px-3 py-1.5 bg-white text-black text-xs font-bold rounded hover:bg-gray-200">Watch</button>
                              <button onClick={() => toggleWatchlist(movie)} className="px-3 py-1.5 border border-red-500/30 text-red-400 text-xs font-bold rounded hover:bg-red-900/20 flex items-center gap-1"><Trash2 className="w-3 h-3" /></button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                <>
                  <div className="mb-6">
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-sm font-bold text-gray-400 uppercase tracking-widest">{searchQuery ? `Searching: "${searchQuery}"` : 'Discover Mode'}</h2>
                      <button onClick={() => setShowFilters(!showFilters)} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${showFilters ? 'bg-red-500/20 text-red-400' : 'bg-neutral-800 text-gray-300 hover:bg-neutral-700'}`}><Filter className="w-3 h-3" /> Filters</button>
                    </div>
                    {showFilters && !searchQuery && (
                      <div className="p-4 rounded-xl bg-neutral-800/50 border border-neutral-700/50 grid grid-cols-1 sm:grid-cols-2 gap-6 animate-in fade-in slide-in-from-top-2">
                        <div>
                          <label className="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Language</label>
                          <div className="flex flex-wrap gap-2">{Object.keys(LANGUAGES).map(lang => (<button key={lang} onClick={() => setSelectedLanguage(lang)} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${selectedLanguage === lang ? 'bg-red-500 text-white shadow-lg shadow-red-500/25' : 'bg-neutral-700 text-gray-300 hover:bg-neutral-600'}`}>{lang}</button>))}</div>
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Genre</label>
                          <div className="flex flex-wrap gap-2">{Object.keys(GENRES).map(genre => (<button key={genre} onClick={() => setSelectedGenre(genre)} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${selectedGenre === genre ? 'bg-red-500 text-white shadow-lg shadow-red-500/25' : 'bg-neutral-700 text-gray-300 hover:bg-neutral-600'}`}>{genre}</button>))}</div>
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="relative min-h-[400px]">
                    {(!currentMovie && !isAnimating) ? (
                      <div className="flex flex-col items-center justify-center h-64 text-center border-2 border-dashed border-neutral-800 rounded-2xl"><div className="animate-pulse flex flex-col items-center"><Film className="w-12 h-12 text-neutral-700 mb-4" /><p className="text-gray-400">Loading library...</p></div></div>
                    ) : isAnimating ? (
                      <div className="flex flex-col items-center justify-center h-[500px] text-center border border-neutral-800 rounded-3xl bg-neutral-800/30"><RefreshCw className="w-16 h-16 text-red-500 animate-spin mb-6" /><h2 className="text-2xl font-bold text-white">{searchQuery ? 'Searching...' : 'Scanning Database...'}</h2></div>
                    ) : (
                      <div className="bg-neutral-800 rounded-3xl overflow-hidden shadow-2xl shadow-black/50 border border-neutral-700/50">
                        <div className="relative">
                          {currentMovie?.backdrop && <div className="absolute inset-0 opacity-20 bg-cover bg-center transition-opacity duration-500" style={{ backgroundImage: `url(${currentMovie.backdrop})` }} />}
                          <div className="absolute inset-0 bg-gradient-to-t from-neutral-900 via-neutral-900/80 to-transparent" />
                          <div className="relative z-10 p-8 md:p-12 flex flex-col md:flex-row gap-8 items-start">
                            <div className="w-full md:w-1/3 aspect-[2/3] bg-neutral-900 rounded-xl overflow-hidden border border-neutral-700 shadow-2xl group relative">
                              {currentMovie?.poster && !imageError ? (<img src={currentMovie.poster} alt={currentMovie.title} onError={() => setImageError(true)} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />) : (<div className="w-full h-full flex flex-col items-center justify-center text-center p-6 bg-gradient-to-b from-neutral-800 to-neutral-900"><Film className="w-16 h-16 text-neutral-700 mb-4" /><span className="text-neutral-500 text-xs uppercase tracking-widest font-bold">{currentMovie?.title}</span></div>)}
                              <button onClick={() => toggleWatchlist(currentMovie)} className="absolute top-3 right-3 p-3 bg-black/60 backdrop-blur-md rounded-full text-white hover:bg-black/80 transition-all active:scale-90 z-20"><Heart className={`w-6 h-6 ${isInWatchlist(currentMovie?.id) ? 'fill-red-500 text-red-500' : 'text-white'}`} /></button>
                            </div>
                            <div className="flex-1 space-y-6 w-full">
                              <div>
                                <div className="flex flex-wrap items-center gap-3 mb-2"><span className="px-2 py-0.5 rounded bg-neutral-700 text-neutral-300 text-[10px] font-bold uppercase tracking-wider">{currentMovie?.language}</span><span className="px-2 py-0.5 rounded bg-neutral-700 text-neutral-300 text-[10px] font-bold uppercase tracking-wider">{currentMovie?.year}</span></div>
                                <h2 className="text-3xl md:text-5xl font-bold text-white leading-tight mb-2 drop-shadow-lg">{currentMovie?.title}</h2>
                                <div className="flex items-center gap-4 text-sm"><div className="flex items-center gap-1 text-yellow-400"><Star className="w-4 h-4 fill-current" /><span className="font-bold">{currentMovie?.rating}</span><span className="text-gray-500">/10 IMDb</span></div><button onClick={openTrailer} className="flex items-center gap-1 text-red-400 hover:text-white transition-colors"><Youtube className="w-4 h-4" /><span className="underline font-bold">Watch Trailer</span></button></div>
                              </div>
                              <p className="text-gray-300 leading-relaxed text-lg font-light line-clamp-4">{currentMovie?.plot || "No plot summary available for this movie."}</p>
                              <div className="pt-4 border-t border-neutral-700">
                                <p className="text-xs text-gray-400 uppercase tracking-widest mb-3 font-semibold">Streaming on</p>
                                <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                                  <button onClick={() => handleWatchClick(currentMovie?.platformUrl)} className={`relative z-20 flex-1 inline-flex items-center justify-center gap-3 px-6 py-4 rounded-xl font-bold text-lg transition-transform active:scale-95 shadow-lg ${getPlatformColor(currentMovie?.platform)}`}><Play className="w-5 h-5 fill-current" />Watch on {currentMovie?.platform || 'Check Online'}<ExternalLink className="w-4 h-4 opacity-50 ml-1" /></button>
                                  <button onClick={handleCopyLink} className="flex items-center justify-center px-4 py-4 rounded-xl bg-neutral-700 hover:bg-neutral-600 text-white transition-colors active:scale-95" title="Copy Link">{copyStatus === 'success' ? (<Check className="w-5 h-5 text-green-400" />) : (<Copy className="w-5 h-5" />)}</button>
                                </div>
                                <p className="mt-3 text-xs text-gray-500 flex items-center gap-1"><Info className="w-3 h-3" />Streaming info provided by JustWatch/TMDB.</p>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                  {!searchQuery && (
                    <div className="mt-12 flex justify-center">
                      <button onClick={() => handleGenerate()} disabled={isAnimating} className={`group relative px-8 py-4 bg-white text-neutral-900 rounded-full font-bold text-xl shadow-[0_0_40px_-10px_rgba(255,255,255,0.3)] hover:shadow-[0_0_60px_-10px_rgba(255,255,255,0.5)] transition-all transform hover:-translate-y-1 active:translate-y-0 overflow-hidden ${isAnimating ? 'opacity-80 cursor-wait' : ''}`}>
                        <span className="relative z-10 flex items-center gap-3">{isAnimating ? (<><RefreshCw className="w-6 h-6 animate-spin" />Scanning Database...</>) : (<>Generate New Movie<RefreshCw className="w-5 h-5 group-hover:rotate-180 transition-transform duration-500" /></>)}</span>
                      </button>
                    </div>
                  )}
                </>
              )}
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<MovieApp />);
    </script>
  </body>
</html>
